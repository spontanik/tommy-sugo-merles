<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Your Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Oswald:wght@600;700&display=swap">
<style>
/* Same look as order.html: light paper, black ink, one sauce red. */
:root { --ground: #f2f2f2; --paper: #fff; --ink: #000; --muted: #4a4a48; --sauce: #ec1c24; color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 16px; line-height: 1.5; }
main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; display: flex; flex-direction: column; gap: 32px; }
h1, h2 { margin: 0; font-family: Oswald, "Arial Narrow", Impact, sans-serif; font-weight: 700; letter-spacing: .01em; line-height: 1.1; overflow-wrap: anywhere; }
h1 { font-size: 40px; }
h2 { font-size: 26px; }
p { margin: 0; }
a { color: var(--ink); }
.stack { display: flex; flex-direction: column; gap: 24px; }
.tag, .lbl { font-family: Oswald, "Arial Narrow", Impact, sans-serif; font-size: 14px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.desc, .muted { color: var(--muted); }
.box { border: 2px solid var(--ink); padding: 20px; background: var(--paper); display: flex; flex-direction: column; gap: 16px; }
.pitch { border-left: 6px solid var(--sauce); padding: 4px 0 4px 16px; }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field { width: 100%; min-height: 48px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); padding: 10px 16px; font: inherit; font-weight: 500; border-radius: 0; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; background: var(--ink); color: #fff; border: 2px solid var(--ink); font-family: Oswald, "Arial Narrow", Impact, sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; cursor: pointer; align-self: flex-start; }
.btn:disabled { opacity: .6; cursor: wait; }
.btn-ghost { background: transparent; color: var(--ink); }
.pill { min-height: 48px; padding: 0 20px; background: transparent; color: var(--ink); border: 2px solid var(--ink); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--ink); color: #fff; }
.back { align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; }
.orders { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.order { border: 2px solid var(--ink); background: var(--paper); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.order-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.order-head strong { font-family: Oswald, "Arial Narrow", Impact, sans-serif; font-size: 20px; letter-spacing: .02em; }
.status { font-weight: 700; }
.status.live { background: var(--sauce); color: #fff; padding: 2px 8px; }
.order-lines { margin: 0; padding: 0; list-style: none; color: var(--muted); }
.order-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; }
.order-foot a { display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; }
.test { font-size: 13px; font-weight: 700; border: 2px solid var(--ink); padding: 0 6px; }
.notice { font-weight: 700; }
.row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
</style>
</head>
<body>
<main id="page" aria-live="polite">
  <a class="back" id="back" href="index.html" data-site="home">← Back to the website</a>
  <p>Loading…</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/sites.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/account.js"></script>
<script>
(function () {
  var A = window.Account;
  var page = document.getElementById("page");
  var backLink = document.getElementById("back");
  var from = new URLSearchParams(location.search).get("from");
  var BACK = { tommy: "← Tommy Sugo", merles: "← Merle's" };
  if (BACK[from]) { backLink.removeAttribute("data-site"); backLink.href = window.Sites.url(from); backLink.textContent = BACK[from]; }
  var NAMES = { tommy: "Tommy Sugo", merles: "Merle's" };
  var LABELS = { pending_payment: "Not paid", received: "Received", preparing: "Being prepared", ready: "Ready for collection", collected: "Collected", cancelled: "Cancelled" };
  var CURRENT = ["pending_payment", "received", "preparing", "ready"];
  var timer = null;
  var recovering = /type=recovery/.test(location.hash);

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function rand(n) { return "R" + (n % 1 ? n.toFixed(2) : n); }
  function when(iso) {
    return new Date(iso).toLocaleString("en-ZA", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function clear() {
    clearTimeout(timer);
    page.textContent = "";
    page.appendChild(backLink);
  }

  function orderCard(o) {
    var li = el("li", "order");
    var head = el("div", "order-head");
    head.appendChild(el("strong", null, (NAMES[o.brand] || "") + " · #" + o.number));
    var current = CURRENT.indexOf(o.status) >= 0 && o.status !== "pending_payment";
    head.appendChild(el("span", "status" + (current ? " live" : ""), LABELS[o.status] || o.status));
    li.appendChild(head);
    li.appendChild(el("p", "muted", when(o.placedAt)));
    var lines = el("ul", "order-lines");
    o.lines.forEach(function (l) { lines.appendChild(el("li", null, l.qty + " × " + l.name)); });
    li.appendChild(lines);
    var foot = el("div", "order-foot");
    var left = el("span", null, rand(o.total));
    if (o.test) { left.appendChild(document.createTextNode(" ")); left.appendChild(el("span", "test", "Test")); }
    foot.appendChild(left);
    var a = el("a", null, current ? "Collection code and progress" : "View order");
    a.href = "order.html?t=" + o.token;
    foot.appendChild(a);
    li.appendChild(foot);
    return li;
  }

  // Current orders first, then the rest. Returns whether anything is still on the go, to keep checking.
  function orderLists(orders, emptyText) {
    var wrap = el("div", "stack");
    var now = orders.filter(function (o) { return CURRENT.indexOf(o.status) >= 0; });
    var past = orders.filter(function (o) { return CURRENT.indexOf(o.status) < 0; });
    [["Current orders", now], ["Previous orders", past]].forEach(function (group) {
      if (!group[1].length) return;
      var sec = el("section", "stack");
      sec.style.gap = "12px";
      sec.appendChild(el("h2", null, group[0]));
      var ul = el("ul", "orders");
      group[1].forEach(function (o) { ul.appendChild(orderCard(o)); });
      sec.appendChild(ul);
      wrap.appendChild(sec);
    });
    if (!orders.length) wrap.appendChild(el("p", "muted", emptyText));
    return { node: wrap, live: now.some(function (o) { return o.status !== "pending_payment"; }) };
  }

  function failed(e) {
    var p = el("p", "notice", e.message || "Couldn't load your orders. Please try again.");
    p.setAttribute("role", "alert");
    return p;
  }

  // ---------- Signed out ----------
  function signedOut() {
    clear();
    page.appendChild(el("h1", null, "Your Orders"));
    if (!A.enabled()) {
      page.appendChild(el("p", "notice", "Accounts couldn't load. Your orders on this device are below."));
    } else {
      var box = el("section", "box");
      box.appendChild(el("p", "pitch", A.PITCH));
      var form = el("div");
      box.appendChild(form);
      page.appendChild(box);
      A.authForm(form, { prefix: "page-", start: "signin", onSignedIn: function () { load(); } });
    }
    var device = el("section", "stack");
    device.style.gap = "12px";
    device.appendChild(el("h2", null, "On this device"));
    device.appendChild(el("p", "muted", "Orders placed in this browser without an account. Sign in to add them to your account."));
    var holder = el("div", null);
    holder.appendChild(el("p", "muted", "Loading…"));
    device.appendChild(holder);
    page.appendChild(device);
    (function draw() {
      A.lookupDevice().then(function (orders) {
        holder.textContent = "";
        var lists = orderLists(orders, "No orders on this device yet.");
        holder.appendChild(lists.node);
        if (lists.live) timer = setTimeout(draw, 30000);
      }).catch(function (e) { holder.textContent = ""; holder.appendChild(failed(e)); });
    })();
  }

  // ---------- Signed in ----------
  function signedIn(session, claim) {
    var user = session.user;
    var device = A.deviceOrders().map(function (o) { return o.t; });
    Promise.all([A.profile(user), A.accountOrders(session, claim ? device : [])]).then(function (r) {
      var profile = r[0], res = r[1];
      clear();
      page.appendChild(el("h1", null, profile.name ? "Hi, " + profile.name.split(" ")[0] + "." : "Your Orders"));
      if (res.added) page.appendChild(el("p", "notice", res.added === 1 ? "Added 1 order from this device to your account." : "Added " + res.added + " orders from this device to your account."));

      // Orders from this device that aren't on the account yet.
      var mine = res.orders.map(function (o) { return o.token; });
      var loose = device.filter(function (t) { return mine.indexOf(t) < 0; });
      if (loose.length && !claim) {
        A.lookupDevice().then(function (orders) {
          var extra = orders.filter(function (o) { return mine.indexOf(o.token) < 0; });
          if (!extra.length) return;
          var row = el("div", "box");
          row.appendChild(el("p", null, (extra.length === 1 ? "1 order" : extra.length + " orders") + " placed on this device without an account."));
          var add = el("button", "btn btn-ghost", "Add to my account");
          add.type = "button";
          add.addEventListener("click", function () { add.disabled = true; signedIn(session, true); });
          row.appendChild(add);
          page.insertBefore(row, lists.node);
        }).catch(function () { /* the account list is what matters here */ });
      }

      var lists = { node: el("div", null) };
      page.appendChild(lists.node);
      page.appendChild(details(user, profile));
      // Only the lists refresh, so nothing typed into Your Details is lost.
      (function draw(orders) {
        var drawn = orderLists(orders, "No orders yet. Your next one will show here.");
        lists.node.textContent = "";
        lists.node.appendChild(drawn.node);
        if (!drawn.live) return;
        timer = setTimeout(function () {
          A.session().then(function (s) { return s ? A.accountOrders(s, []) : Promise.reject(new Error("signed out")); })
            .then(function (r) { draw(r.orders); })
            .catch(function () { timer = setTimeout(function () { draw(orders); }, 30000); });
        }, 30000);
      })(res.orders);
    }).catch(function (e) {
      clear();
      page.appendChild(el("h1", null, "Your Orders"));
      page.appendChild(failed(e));
      var again = el("button", "btn", "Try again");
      again.type = "button";
      again.addEventListener("click", load);
      page.appendChild(again);
    });
  }

  function details(user, profile) {
    var box = el("section", "box");
    box.appendChild(el("h2", null, "Your Details"));
    box.appendChild(el("p", "muted", "Signed in as " + user.email));
    function input(id, label, type, value, auto, hint) {
      var f = el("div", "fld");
      var l = el("label", "lbl", label); l.htmlFor = id;
      var i = el("input", "field"); i.id = id; i.type = type; i.value = value || ""; i.autocomplete = auto;
      f.appendChild(l); f.appendChild(i);
      if (hint) f.appendChild(el("p", "desc", hint));
      box.appendChild(f);
      return i;
    }
    var name = input("me-name", "Your name", "text", profile.name, "name");
    var phone = input("me-phone", "Cell number", "tel", profile.phone, "tel", "Give this number at the counter to collect loyalty points.");
    var check = el("label");
    check.style.cssText = "display:flex;gap:12px;align-items:flex-start;cursor:pointer";
    var box2 = el("input"); box2.type = "checkbox"; box2.checked = !!profile.specials;
    box2.style.cssText = "width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:currentColor";
    check.appendChild(box2);
    check.appendChild(el("span", null, "Send me specials and news by email. You can stop any time."));
    box.appendChild(check);
    var msg = el("p", "notice"); msg.setAttribute("role", "status"); msg.hidden = true;
    var row = el("div", "row");
    var save = el("button", "btn", "Save Details"); save.type = "button";
    var out = el("button", "btn btn-ghost", "Sign Out"); out.type = "button";
    row.appendChild(save); row.appendChild(out);
    box.appendChild(row); box.appendChild(msg);

    save.addEventListener("click", function () {
      var cell = A.cleanPhone(phone.value);
      if (!name.value.trim()) { msg.textContent = "Add your name."; msg.hidden = false; return; }
      if (!cell) { msg.textContent = "Add a South African cell number, like 082 123 4567."; msg.hidden = false; return; }
      save.disabled = true;
      A.saveProfile(user, { name: name.value.trim(), phone: cell, specials: box2.checked })
        .then(function () { msg.textContent = "Saved."; })
        .catch(function (e) { msg.textContent = e.message; })
        .then(function () { save.disabled = false; msg.hidden = false; });
    });
    out.addEventListener("click", function () { out.disabled = true; A.signOut().then(signedOut); });
    return box;
  }

  // ---------- New password, from the reset email ----------
  function newPassword() {
    clear();
    page.appendChild(el("h1", null, "Choose a New Password"));
    var box = el("section", "box");
    var f = el("div", "fld");
    var l = el("label", "lbl", "New password"); l.htmlFor = "new-pass";
    var i = el("input", "field"); i.id = "new-pass"; i.type = "password"; i.autocomplete = "new-password";
    f.appendChild(l); f.appendChild(i); f.appendChild(el("p", "desc", "At least 8 characters."));
    var btn = el("button", "btn", "Save Password"); btn.type = "button";
    var msg = el("p", "notice"); msg.setAttribute("role", "alert"); msg.hidden = true;
    box.appendChild(f); box.appendChild(btn); box.appendChild(msg);
    page.appendChild(box);
    btn.addEventListener("click", function () {
      if (i.value.length < 8) { msg.textContent = "Use a password of at least 8 characters."; msg.hidden = false; return; }
      btn.disabled = true;
      A.updatePassword(i.value).then(function () { recovering = false; load(); })
        .catch(function (e) { btn.disabled = false; msg.textContent = e.message; msg.hidden = false; });
    });
  }

  function load() {
    if (recovering) { newPassword(); return; }
    A.session().then(function (s) { if (s) signedIn(s, false); else signedOut(); }).catch(signedOut);
  }

  A.onChange(function (event) {
    if (event === "PASSWORD_RECOVERY") { recovering = true; newPassword(); }
  });
  load();
})();
</script>
</body>
</html>
