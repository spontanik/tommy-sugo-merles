<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Your Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Oswald:wght@600;700&display=swap">
<style>
:root { --ground: #f2f2f2; --ink: #000; --muted: #4a4a48; --sauce: #ec1c24; color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 16px; line-height: 1.5; }
main { max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; display: flex; flex-direction: column; gap: 24px; }
h1 { margin: 0; font-family: Oswald, "Arial Narrow", Impact, sans-serif; font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: .01em; overflow-wrap: anywhere; }
p { margin: 0; }
.tag { font-family: Oswald, "Arial Narrow", Impact, sans-serif; font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.muted { color: var(--muted); }
.lede { font-size: 20px; line-height: 1.4; font-weight: 500; }
.box { border: 2px solid var(--ink); padding: 20px; display: flex; flex-direction: column; gap: 8px; background: #fff; }
.code { font-family: Oswald, "Arial Narrow", Impact, sans-serif; font-size: 72px; line-height: 1; font-weight: 700; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.steps li { display: flex; align-items: center; gap: 12px; min-height: 44px; color: var(--muted); }
.steps li::before { content: ""; width: 20px; height: 20px; flex: none; border: 2px solid currentColor; }
.steps li.done { color: var(--ink); }
.steps li.done::before { background: var(--ink); border-color: var(--ink); }
.steps li.now { color: var(--ink); font-weight: 700; }
.steps li.now::before { background: var(--sauce); border-color: var(--ink); }
.lines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.lines li { display: flex; justify-content: space-between; gap: 16px; }
.lines .name { min-width: 0; overflow-wrap: anywhere; }
.total { display: flex; justify-content: space-between; gap: 16px; font-weight: 700; border-top: 2px solid var(--ink); padding-top: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; background: var(--ink); color: #fff; font-weight: 700; text-decoration: none; align-self: flex-start; }
.back { align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; color: var(--ink); font-weight: 700; }
.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
.test { background: var(--ink); color: #fff; padding: 8px 12px; font-size: 14px; font-weight: 700; }
</style>
</head>
<body>
<main id="order" aria-live="polite"><p>Loading your order…</p></main>
<script src="js/sites.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/account.js"></script>
<script>
(function () {
  var conf = window.SITE_SUPABASE || {};
  var params = new URLSearchParams(location.search);
  var token = params.get("t") || "";
  var box = document.getElementById("order");
  var NAMES = { tommy: "Tommy Sugo", merles: "Merle's" };
  var STAGES = ["received", "preparing", "ready", "collected"];
  // The progress list always says plainly where the order is, whatever the voice.
  var STEP_NAMES = { received: "Order received", preparing: "Being prepared", ready: "Ready for collection", collected: "Collected" };
  // A voice gives each stage [heading, line under the heading]. While it's being made, the line is a list that
  // moves on every PREP_EVERY, so the page follows the pizza from base to box.
  var PLAIN = {
    received: ["We've Got Your Order."],
    preparing: ["It's Being Made."],
    ready: ["Come and Get It."],
    collected: ["Enjoy."]
  };
  // Tommy Sugo orders get one of these voices, picked from the order's token: the same voice every time that order's
  // page opens, and a different one from order to order. Other brands keep PLAIN until they have their own.
  var VOICES = {
    tommy: [
      { // Kitchen Call
        received: ["Your Order's In.", "It's on the rail. The oven's hot."],
        preparing: ["We're Making It.", ["Base rolled.", "Sauce on.", "In the oven.", "Out and sliced."]],
        ready: ["Ready for You.", "Boxed and on the counter. Bring your code."],
        collected: ["All Yours.", "Out the door. Eat it while it's hot."]
      },
      { // The Obsession
        received: ["We've Got Your Order.", "Dough's out. Oven's hot. You're next."],
        preparing: ["Hands in the Dough.", [
          "Base hand-rolled. Thin, the way it should be.",
          "7-hour slow-cooked Roma tomato sauce going on.",
          "Mozzarella down. Into the oven.",
          "The cheese is starting to melt.",
          "Crust blistering. Nearly there."
        ]],
        ready: ["Come and Get It.", "Boxed, hot and waiting at the counter. Bring your code."],
        collected: ["The Secret's in the Sauce.", "Now you know. Eat it while it's hot."]
      },
      { // Saved My Life
        received: ["The Oven's Calling.", "Your order's in. Get ready."],
        preparing: ["Ooh, Here We Go.", [
          "7 hours of sauce, all for you.",
          "Ooh. That cheese is starting to melt.",
          "Crust going golden. Hold tight."
        ]],
        ready: ["Your Dreams Are About to Come True.", "They're boxed at the counter. Bring your code."],
        collected: ["Tonight a Pizza Saved Your Life.", "Thanks for coming to get it. See you next time."]
      }
    ]
  };
  var PREP_EVERY = 45 * 1000;
  var timer = null;
  var prepTimer = null;
  var last = null;

  function voiceFor(o) {
    var set = VOICES[o.brand];
    if (!set) return PLAIN;
    var n = parseInt(token.slice(0, 8), 16);
    return set[(isNaN(n) ? 0 : n) % set.length];
  }

  // When this browser first saw the order being made, so a reload carries on where the updates were.
  function prepStart() {
    var key = "tsm-prep-" + token.slice(0, 16);
    try {
      var at = Number(localStorage.getItem(key));
      if (at) return at;
      localStorage.setItem(key, String(Date.now()));
    } catch (e) { /* private browsing: start from the first update */ }
    return Date.now();
  }

  // The updates walk forward and stop on the last one: no going back to the base once it's in the oven.
  function prepLine(p, lines, start) {
    function show() {
      var i = Math.min(lines.length - 1, Math.floor((Date.now() - start) / PREP_EVERY));
      p.textContent = lines[i];
      if (i < lines.length - 1) prepTimer = setTimeout(show, PREP_EVERY - ((Date.now() - start) % PREP_EVERY));
    }
    show();
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function rand(n) { n = Number(n); return "R" + (n % 1 ? n.toFixed(2) : n); }

  function link(cls, text, href) {
    var a = el("a", cls, text);
    a.href = href;
    return a;
  }
  function home(o) { return window.Sites.url(o.brand); }

  function summary(o) {
    var section = el("div", "box");
    section.appendChild(el("p", "tag", "Your order"));
    var list = el("ul", "lines");
    o.lines.forEach(function (l) {
      var li = el("li");
      li.appendChild(el("span", "name", l.qty + " × " + l.name));
      li.appendChild(el("span", null, rand(l.price)));
      list.appendChild(li);
    });
    section.appendChild(list);
    var total = el("div", "total");
    total.appendChild(el("span", null, "Total"));
    total.appendChild(el("span", null, rand(o.total)));
    section.appendChild(total);
    return section;
  }

  function draw(o) {
    clearTimeout(prepTimer);
    box.textContent = "";
    box.appendChild(link("back", "← " + (NAMES[o.brand] || "Back to the website"), home(o)));
    body(o);
    var foot = el("div", "foot");
    foot.appendChild(link("btn", o.status === "pending_payment" ? "Back to the menu" : "Order something else", home(o) + "#menu"));
    foot.appendChild(link("back", "All your orders", "account.html?from=" + encodeURIComponent(o.brand)));
    box.appendChild(foot);
  }

  function body(o) {
    var paid = params.get("paid");
    box.appendChild(el("p", "tag", (NAMES[o.brand] || "") + " · Order #" + o.number));
    if (o.test) box.appendChild(el("p", "test", "Test order: no money was taken and the kitchen shouldn't make this."));

    if (o.status === "cancelled" && o.expired) {
      box.appendChild(el("h1", null, "This Order Wasn't Paid in Time."));
      box.appendChild(el("p", null, "We hold your items for 30 minutes while you pay. This order wasn't paid, so we've released them and you haven't been charged. Please order again."));
      box.appendChild(summary(o));
      return;
    }
    if (o.status === "cancelled") {
      box.appendChild(el("h1", null, "This Order Was Cancelled."));
      box.appendChild(el("p", null, "If you've paid and have questions, please contact us with your order number."));
      box.appendChild(summary(o));
      return;
    }
    if (o.status === "pending_payment") {
      var stopped = paid === "cancelled" || paid === "failed";
      box.appendChild(el("h1", null, stopped ? "You Haven't Paid Yet." : "Confirming Your Payment…"));
      box.appendChild(el("p", null, stopped
        ? (paid === "failed" ? "The payment didn't go through, and the kitchen hasn't received this order." : "You left the payment page, and the kitchen hasn't received this order.")
        : "This usually takes a few seconds. Keep this page open."));
      if (stopped) box.appendChild(el("p", "muted", "We're holding your items for 30 minutes from when you placed the order."));
      if (stopped && o.payUrl) {
        var again = el("a", "btn", "Try paying again");
        again.href = o.payUrl;
        box.appendChild(again);
      }
      box.appendChild(summary(o));
      return;
    }

    var voice = voiceFor(o);
    var stage = voice[o.status];
    box.appendChild(el("h1", null, stage[0]));
    if (stage[1]) {
      var say = el("p", "lede");
      if (Array.isArray(stage[1])) {
        say.setAttribute("aria-live", "off"); // the updates are flavour: don't read each one out
        prepLine(say, stage[1], prepStart());
      } else {
        say.textContent = stage[1];
      }
      box.appendChild(say);
    }
    if (o.status !== "collected") {
      var card = el("div", "box");
      card.appendChild(el("p", "tag", "Your collection code"));
      card.appendChild(el("p", "code", o.code));
      card.appendChild(el("p", null, "Give us this code when you collect. We've also emailed it to you, with a link back to this page."));
      if (o.collectFrom) card.appendChild(el("p", "muted", "Collect from: " + o.collectFrom));
      box.appendChild(card);
    }
    var at = STAGES.indexOf(o.status);
    var steps = el("ol", "steps");
    STAGES.forEach(function (s, i) {
      var li = el("li", i < at ? "done" : i === at ? "now" : "", STEP_NAMES[s]);
      if (i === at) li.setAttribute("aria-current", "step");
      steps.appendChild(li);
    });
    box.appendChild(steps);
    box.appendChild(summary(o));
  }

  function fail(message) {
    box.textContent = "";
    box.appendChild(el("h1", null, "We Can't Show This Order."));
    box.appendChild(el("p", null, message));
    box.appendChild(link("btn", "Go to the website", window.Sites.url("home")));
  }

  function load() {
    fetch(conf.url.replace(/\/$/, "") + "/functions/v1/order-status?t=" + encodeURIComponent(token), {
      headers: { apikey: conf.key, Authorization: "Bearer " + conf.key }
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (!res.ok) { fail(res.error || "Please check the link in your email."); return; }
      // Kept in this browser, so the order can be found again from account.html without an account.
      if (!last && window.Account) window.Account.remember(token, res.order.brand, res.order.number);
      var now = JSON.stringify(res.order);
      if (now !== last) { last = now; draw(res.order); }
      var over = res.order.status === "collected" || res.order.status === "cancelled";
      var waiting = res.order.status === "pending_payment";
      if (!over) timer = setTimeout(load, waiting ? 3000 : 15000);
    }).catch(function () {
      // Keep what's on screen and try again: a dropped connection isn't a problem with the order.
      if (!last) fail("Please check your connection. We'll keep trying.");
      timer = setTimeout(load, 15000);
    });
  }

  if (!token) fail("Please use the link in your email."); else load();
  // Browsers slow timers in a background tab: coming back to it checks straight away.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden || !token || !last) return;
    var o = JSON.parse(last);
    if (o.status === "collected" || o.status === "cancelled") return;
    clearTimeout(timer);
    load();
  });
})();
</script>
</body>
</html>
