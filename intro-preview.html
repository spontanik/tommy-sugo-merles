<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Landing Intro · Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap">
<style>
/* A preview of the landing page's opening, to play and test it. The real landing page (index.html?intro=preview) runs
   in the frame at the screen size picked; the bar drives it through window.LandingIntro (js/landing-intro.js): play,
   pause, replay, scrub to any moment, slow it down. In preview the opening stops on its last frame instead of finishing. */
:root {
  --ink: #000000;
  --paper: #f2f2f2;
  --shade: #d3d2d2;
  --muted: #4a4a48;
  --sauce: #ec1c24;
  --sans: "Proxima Nova", Montserrat, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: #2b2b2a; color: var(--ink); font-family: var(--sans); font-size: 14px; font-weight: 500; }
.strip { background: var(--ink); color: var(--paper); font-size: 12px; font-weight: 800; letter-spacing: 0.28em; text-align: center; padding: 8px 16px; }

.bar { background: var(--paper); border-bottom: 4px solid var(--ink); padding: 10px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 8px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
button, select { font: inherit; font-weight: 800; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); min-height: 36px; padding: 0 12px; cursor: pointer; }
button.main { background: var(--ink); color: var(--paper); min-width: 96px; }
button:hover { background: var(--ink); color: var(--paper); }
button.main:hover { background: var(--sauce); border-color: var(--sauce); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--sauce); outline-offset: 2px; }
label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
.time { font-variant-numeric: tabular-nums; font-weight: 800; min-width: 92px; }
.now { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
.now b { color: var(--sauce); }

/* The scrubber, with each step of the opening marked under it (click a mark to jump there). */
.track { position: relative; padding-bottom: 36px; }
input[type=range] { width: 100%; margin: 0; accent-color: var(--sauce); cursor: pointer; }
.marks { position: absolute; left: 8px; right: 8px; bottom: 0; height: 34px; }
.marks button { position: absolute; transform: translateX(-50%); min-height: 0; height: 18px; padding: 0 4px; border: 0; background: none; font-size: 10px; letter-spacing: 0.04em; color: var(--muted); white-space: nowrap; }
.marks button::before { content: ""; position: absolute; left: 50%; top: -5px; width: 2px; height: 5px; background: var(--muted); }
.marks button:hover { background: none; color: var(--sauce); }
/* Every other label sits a row lower, so close steps don't overlap. */
.marks button:nth-child(even) { top: 16px; }
.marks button:nth-child(even)::before { top: -21px; height: 21px; }
@media (max-width: 760px) { .marks button, .marks button:nth-child(even) { top: 0; font-size: 0; width: 10px; } .marks button::before, .marks button:nth-child(even)::before { top: 2px; height: 10px; } }

/* The screen: the landing page at the size picked, shrunk to fit if it's bigger than the space. */
.stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.screen { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; background: #fff; box-shadow: 0 0 0 4px var(--ink), 0 12px 40px rgba(0, 0, 0, .5); }
.screen iframe { display: block; width: 100%; height: 100%; border: 0; }
.size-note { position: absolute; left: 12px; bottom: 8px; color: var(--shade); font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
</style>
</head>
<body>

<div class="strip">PREVIEW · LANDING PAGE INTRO</div>

<div class="bar">
  <div class="row">
    <button class="main" id="play" type="button">Play</button>
    <button id="replay" type="button">Replay</button>
    <button id="back" type="button" aria-label="Back a tenth of a second">−0.1s</button>
    <button id="fwd" type="button" aria-label="Forward a tenth of a second">+0.1s</button>
    <span class="time" id="time">0.00 / 0.00s</span>
    <label>Speed
      <select id="speed">
        <option value="0.25">¼×</option>
        <option value="0.5">½×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
      </select>
    </label>
    <label>Screen
      <select id="size">
        <option value="1440x900" selected>Laptop 1440 × 900</option>
        <option value="1280x720">Small laptop 1280 × 720</option>
        <option value="1920x1080">Desktop 1920 × 1080</option>
        <option value="1024x768">Tablet sideways 1024 × 768</option>
        <option value="390x844">Phone 390 × 844</option>
        <option value="375x667">Small phone 375 × 667</option>
      </select>
    </label>
    <span class="now">Now: <b id="step">Bare tiles</b></span>
  </div>
  <div class="track">
    <input type="range" id="scrub" min="0" max="8600" step="10" value="0" aria-label="Moment in the intro">
    <div class="marks" id="marks"></div>
  </div>
</div>

<div class="stage" id="stage">
  <div class="screen" id="screen"><iframe id="frame" title="The landing page, playing its intro" src="index.html?intro=preview"></iframe></div>
  <span class="size-note" id="note"></span>
</div>

<script>
(function () {
  var frame = document.getElementById("frame"), screen = document.getElementById("screen"), stage = document.getElementById("stage");
  var playBtn = document.getElementById("play"), scrub = document.getElementById("scrub"), timeEl = document.getElementById("time");
  var stepEl = document.getElementById("step"), marksEl = document.getElementById("marks"), note = document.getElementById("note");
  var api = null, W = 1440, H = 900, scrubbing = false;

  // The steps of the opening, by when each starts (from js/landing-intro.js's timeline once it's loaded).
  function stepsFrom(T) {
    return [
      [T.drive[0], "Drive in"], [T.drive[1], "Bump"], [T.hatchT[0], "Hatches"],
      [T.popT[0], "Faces up"], [T.turn[0], "Turn"], [T.spin[0], "Spin"], [T.crop[0], "Logos"],
      [T.crop[1], "Doors"], [T.events, "Events"], [T.shop, "Shop"]
    ];
  }
  var steps = [];

  function fit() {
    var k = Math.min(1, (stage.clientWidth - 32) / W, (stage.clientHeight - 40) / H);
    screen.style.width = W + "px"; screen.style.height = H + "px";
    screen.style.transform = "scale(" + k + ") translate(-50%, -50%)";
    note.textContent = W + " × " + H + (k < 1 ? " · shown at " + Math.round(k * 100) + "%" : "");
  }
  window.addEventListener("resize", fit);

  function connect() {
    api = frame.contentWindow && frame.contentWindow.LandingIntro;
    if (!api || !api.steps) { api = null; return; }
    var T = api.steps;
    scrub.max = T.end;
    steps = stepsFrom(T);
    marksEl.textContent = "";
    steps.forEach(function (s) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = s[1]; b.title = s[1] + " (" + (s[0] / 1000).toFixed(2) + "s)";
      b.style.left = (s[0] / T.end * 100) + "%";
      b.addEventListener("click", function () { api.pause(); api.seek(s[0]); });
      marksEl.appendChild(b);
    });
    api.setSpeed(+document.getElementById("speed").value);
    api.play();
  }
  // Look for the page's controls until they're there (the frame can finish loading before this runs, and again after
  // each change of screen size).
  setInterval(function () { if (!api) connect(); }, 150);

  // Keep the bar in step with the page.
  (function tick() {
    if (api) {
      var t = api.time(), end = api.steps.end;
      if (!scrubbing) scrub.value = t;
      timeEl.textContent = (t / 1000).toFixed(2) + " / " + (end / 1000).toFixed(2) + "s";
      playBtn.textContent = api.paused() ? (t >= end ? "Play again" : "Play") : "Pause";
      var name = "Bare tiles";
      steps.forEach(function (s) { if (t >= s[0]) name = s[1]; });
      stepEl.textContent = t >= end ? "Done" : name;
    }
    requestAnimationFrame(tick);
  })();

  playBtn.addEventListener("click", function () { if (!api) return; if (api.paused()) api.play(); else api.pause(); });
  document.getElementById("replay").addEventListener("click", function () { if (!api) return; api.seek(0); api.play(); });
  document.getElementById("back").addEventListener("click", function () { if (!api) return; api.pause(); api.seek(api.time() - 100); });
  document.getElementById("fwd").addEventListener("click", function () { if (!api) return; api.pause(); api.seek(api.time() + 100); });
  document.getElementById("speed").addEventListener("change", function (e) { if (api) api.setSpeed(+e.target.value); });
  scrub.addEventListener("input", function () { if (!api) return; scrubbing = true; api.pause(); api.seek(+scrub.value); });
  scrub.addEventListener("change", function () { scrubbing = false; });
  document.getElementById("size").addEventListener("change", function (e) {
    var wh = e.target.value.split("x");
    W = +wh[0]; H = +wh[1];
    fit();
    // Reload at the new size, so the page lays itself out (and picks its phone or desktop layout) from the start.
    api = null;
    frame.src = "index.html?intro=preview&w=" + W;
  });
  // Space plays and pauses, the arrow keys step.
  window.addEventListener("keydown", function (e) {
    if (!api || e.target.tagName === "SELECT" || e.target.tagName === "INPUT" && e.key !== " ") return;
    if (e.key === " ") { e.preventDefault(); playBtn.click(); }
    else if (e.key === "ArrowLeft") { api.pause(); api.seek(api.time() - 100); }
    else if (e.key === "ArrowRight") { api.pause(); api.seek(api.time() + 100); }
  });

  fit();
})();
</script>
</body>
</html>
