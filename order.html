<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Your Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Oswald:wght@600;700&display=swap">
<style>
:root { --ground: #f2f2f2; --ink: #000; --muted: #4a4a48; --sauce: #ec1c24; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 16px; line-height: 1.5; }
main { max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; display: flex; flex-direction: column; gap: 24px; }
h1 { margin: 0; font-family: Oswald, "Arial Narrow", Impact, sans-serif; font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: .01em; overflow-wrap: anywhere; }
p { margin: 0; }
.tag { font-family: Oswald, "Arial Narrow", Impact, sans-serif; font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.muted { color: var(--muted); }
.box { border: 2px solid var(--ink); padding: 20px; display: flex; flex-direction: column; gap: 8px; background: #fff; }
.code { font-family: Oswald, "Arial Narrow", Impact, sans-serif; font-size: 72px; line-height: 1; font-weight: 700; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.steps li { display: flex; align-items: center; gap: 12px; min-height: 44px; color: var(--muted); }
.steps li::before { content: ""; width: 20px; height: 20px; flex: none; border: 2px solid currentColor; }
.steps li.done { color: var(--ink); }
.steps li.done::before { background: var(--ink); border-color: var(--ink); }
.steps li.now { color: var(--ink); font-weight: 700; }
.steps li.now::before { background: var(--sauce); border-color: var(--ink); }
.lines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.lines li { display: flex; justify-content: space-between; gap: 16px; }
.lines .name { min-width: 0; overflow-wrap: anywhere; }
.total { display: flex; justify-content: space-between; gap: 16px; font-weight: 700; border-top: 2px solid var(--ink); padding-top: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; background: var(--ink); color: #fff; font-weight: 700; text-decoration: none; align-self: flex-start; }
.test { background: var(--ink); color: #fff; padding: 8px 12px; font-size: 14px; font-weight: 700; }
</style>
</head>
<body>
<main id="order" aria-live="polite"><p>Loading your order…</p></main>
<script src="js/supabase-config.js"></script>
<script>
(function () {
  var conf = window.SITE_SUPABASE || {};
  var params = new URLSearchParams(location.search);
  var token = params.get("t") || "";
  var box = document.getElementById("order");
  var PAGES = { tommy: "tommy-sugo.html#menu", merles: "merles-schnitz.html#menu" };
  var NAMES = { tommy: "Tommy Sugo", merles: "Merle's" };
  var STEPS = [["received", "Order received"], ["preparing", "Being prepared"], ["ready", "Ready for collection"], ["collected", "Collected"]];
  var HEADINGS = { received: "We've Got Your Order.", preparing: "It's Being Made.", ready: "Come and Get It.", collected: "Enjoy." };
  var timer = null;
  var last = null;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function rand(n) { n = Number(n); return "R" + (n % 1 ? n.toFixed(2) : n); }

  function backLink(o, text) {
    var a = el("a", "btn", text);
    a.href = PAGES[o.brand] || "index.html";
    return a;
  }

  function summary(o) {
    var section = el("div", "box");
    section.appendChild(el("p", "tag", "Your order"));
    var list = el("ul", "lines");
    o.lines.forEach(function (l) {
      var li = el("li");
      li.appendChild(el("span", "name", l.qty + " × " + l.name));
      li.appendChild(el("span", null, rand(l.price)));
      list.appendChild(li);
    });
    section.appendChild(list);
    var total = el("div", "total");
    total.appendChild(el("span", null, "Total"));
    total.appendChild(el("span", null, rand(o.total)));
    section.appendChild(total);
    return section;
  }

  function draw(o) {
    box.textContent = "";
    var paid = params.get("paid");
    box.appendChild(el("p", "tag", (NAMES[o.brand] || "") + " · Order #" + o.number));
    if (o.test) box.appendChild(el("p", "test", "Test order: no money was taken and the kitchen shouldn't make this."));

    if (o.status === "cancelled") {
      box.appendChild(el("h1", null, "This Order Was Cancelled."));
      box.appendChild(el("p", null, "If you've paid and have questions, please contact us with your order number."));
      box.appendChild(summary(o));
      box.appendChild(backLink(o, "Back to the menu"));
      return;
    }
    if (o.status === "pending_payment") {
      var stopped = paid === "cancelled" || paid === "failed";
      box.appendChild(el("h1", null, stopped ? "You Haven't Paid Yet." : "Confirming Your Payment…"));
      box.appendChild(el("p", null, stopped
        ? (paid === "failed" ? "The payment didn't go through, and the kitchen hasn't received this order." : "You left the payment page, and the kitchen hasn't received this order.")
        : "This usually takes a few seconds. Keep this page open."));
      if (stopped && o.payUrl) {
        var again = el("a", "btn", "Try paying again");
        again.href = o.payUrl;
        box.appendChild(again);
      }
      box.appendChild(summary(o));
      if (stopped) box.appendChild(backLink(o, "Back to the menu"));
      return;
    }

    box.appendChild(el("h1", null, HEADINGS[o.status]));
    if (o.status !== "collected") {
      var card = el("div", "box");
      card.appendChild(el("p", "tag", "Your collection code"));
      card.appendChild(el("p", "code", o.code));
      card.appendChild(el("p", null, "Give us this code when you collect. We've also emailed it to you, with a link back to this page."));
      if (o.collectFrom) card.appendChild(el("p", "muted", "Collect from: " + o.collectFrom));
      box.appendChild(card);
    }
    var at = STEPS.map(function (s) { return s[0]; }).indexOf(o.status);
    var steps = el("ol", "steps");
    STEPS.forEach(function (s, i) {
      var li = el("li", i < at ? "done" : i === at ? "now" : "", s[1]);
      if (i === at) li.setAttribute("aria-current", "step");
      steps.appendChild(li);
    });
    box.appendChild(steps);
    box.appendChild(summary(o));
  }

  function fail(message) {
    box.textContent = "";
    box.appendChild(el("h1", null, "We Can't Show This Order."));
    box.appendChild(el("p", null, message));
  }

  function load() {
    fetch(conf.url.replace(/\/$/, "") + "/functions/v1/order-status?t=" + encodeURIComponent(token), {
      headers: { apikey: conf.key, Authorization: "Bearer " + conf.key }
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (!res.ok) { fail(res.error || "Please check the link in your email."); return; }
      var now = JSON.stringify(res.order);
      if (now !== last) { last = now; draw(res.order); }
      var over = res.order.status === "collected" || res.order.status === "cancelled";
      var waiting = res.order.status === "pending_payment";
      if (!over) timer = setTimeout(load, waiting ? 3000 : 15000);
    }).catch(function () {
      // Keep what's on screen and try again: a dropped connection isn't a problem with the order.
      if (!last) fail("Please check your connection. We'll keep trying.");
      timer = setTimeout(load, 15000);
    });
  }

  if (!token) fail("Please use the link in your email."); else load();
})();
</script>
</body>
</html>
